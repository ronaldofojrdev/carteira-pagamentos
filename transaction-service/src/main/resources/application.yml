server:
  port: 8082

spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/transactions}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 2.0

wallet:
  retry:
    # job que reenvia comandos de transferencias paradas (ex: broker caiu depois do commit)
    enabled: true
    interval-ms: 30000
    stuck-after-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
